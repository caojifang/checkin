name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '10 16 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}

  # ===== 以下为新增 job：防止 GitHub 因「仓库 60 天无新提交」自动禁用定时任务 =====
  keepalive:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: 保活心跳
        run: |
          if [ -z "$(git log --since='45 days ago' --oneline)" ]; then
            echo "距上次提交已超过 45 天，创建保活提交"
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore: keepalive [skip ci]'
            git push
          else
            echo "距上次提交不足 45 天，无需保活"
          fi
