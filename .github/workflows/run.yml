name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '10 16 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
          # 积分自动兑换开关：true=满阈值自动兑换天数，false=关闭
          AUTO_EXCHANGE: ${{ vars.AUTO_EXCHANGE || 'false' }}
          EXCHANGE_THRESHOLD: ${{ vars.EXCHANGE_THRESHOLD || '500' }}

  # ===== 防止 GitHub 因「公开仓库 60 天无活动」自动停用定时任务 =====
  keepalive:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 保活心跳
        run: |
          if [ -z "$(git log --since='45 days ago' --oneline)" ]; then
            echo "距上次提交已超过 45 天，创建保活提交"
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore: keepalive [skip ci]'
            git push
          else
            echo "距上次提交不足 45 天，无需保活"
          fi
